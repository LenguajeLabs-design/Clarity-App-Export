kind = "web"
previewPath = "/"
title = "Clarity"
version = "1.0.0"
id = "artifacts/clarity"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26011

[services.development]
run = "pnpm --filter @workspace/clarity run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/clarity", "run", "build" ]
publicDir = "artifacts/clarity/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26011"
BASE_PATH = "/"
